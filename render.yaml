services:
  - type: web
    name: pitastropha-social
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "pitastropha-social.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: pitastropha-social-db
          property: connectionString

databases:
  - name: pitastropha-social-db
    plan: free

